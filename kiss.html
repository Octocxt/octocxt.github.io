<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy kiss day mau 💓😘</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ff9ecf, #ffe6f0, #ffcce6);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', sans-serif;
        text-align: center;
        overflow: hidden;
    }

    .container {
        background: rgba(255, 255, 255, 0.6);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(255, 77, 136, 0.3);
        backdrop-filter: blur(10px);
    }

    h1 {
        color: #ff1a75;
        font-size: 34px;
        margin-bottom: 10px;
        text-shadow: 0 0 10px rgba(255, 77, 136, 0.5);
    }

    #timer {
        font-weight: bold;
        color: #e6005c;
        font-size: 20px;
    }

    h3 {
        margin-top: 20px;
        color: #cc0066;
        font-weight: normal;
        font-style: italic;
    }

    .heart {
        position: absolute;
        bottom: -20px;
        font-size: 20px;
        animation: floatUp 8s linear infinite;
        color: rgba(255, 0, 102, 0.5);
    }

    @keyframes floatUp {
        from {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
        to {
            transform: translateY(-110vh) scale(1.5);
            opacity: 0;
        }
    }
</style>
</head>

<body>

<div class="container">
    <h1>
        💕 It's been <br><span id="timer"></span><br>
        since our first kiss 😘
    </h1>
    <h3>You are my first, my last, my everything 💖</h3>
</div>

<script>
    const oldTimestamp = 1758000600;

    function updateTimer() {
        const now = new Date();
        const past = new Date(oldTimestamp * 1000);

        let diff = Math.floor((now - past) / 1000);

        const months = Math.floor(diff / (30 * 24 * 60 * 60));
        diff %= (30 * 24 * 60 * 60);

        const days = Math.floor(diff / (24 * 60 * 60));
        diff %= (24 * 60 * 60);

        const hours = Math.floor(diff / (60 * 60));
        diff %= (60 * 60);

        const minutes = Math.floor(diff / 60);
        const seconds = diff % 60;

        document.getElementById("timer").innerText =
            `${months} months ${days} days ${hours} hours ${minutes} minutes ${seconds} seconds`;
    }

    updateTimer();
    setInterval(updateTimer, 1000);

    function createHeart() {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 20 + 15) + "px";
        heart.style.animationDuration = (Math.random() * 5 + 5) + "s";
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 8000);
    }

    setInterval(createHeart, 500);
</script>

</body>
</html>
