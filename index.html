<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title><3</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ffb6d9, #ffd6e8, #ffeaf4);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', sans-serif;
        overflow: hidden;
        animation: fadeIn 2s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .box {
        background: rgba(255, 255, 255, 0.8);
        padding: 40px 50px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(255, 77, 136, 0.3);
        backdrop-filter: blur(10px);
        position: relative;
    }

    h1 {
        color: #ff1a75;
        margin-bottom: 25px;
        font-size: 28px;
        text-shadow: 0 0 10px rgba(255, 77, 136, 0.4);
    }

    button {
        padding: 12px 30px;
        font-size: 16px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        margin: 10px;
        background: linear-gradient(45deg, #ff4d88, #ff80aa);
        color: white;
        transition: 0.3s ease;
        box-shadow: 0 5px 15px rgba(255, 77, 136, 0.4);
    }

    button:hover {
        transform: scale(1.1);
        box-shadow: 0 8px 20px rgba(255, 77, 136, 0.6);
    }

    .heart {
        position: absolute;
        bottom: -20px;
        font-size: 20px;
        animation: floatUp 8s linear infinite;
        color: rgba(255, 0, 102, 0.4);
    }

    @keyframes floatUp {
        from {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
        to {
            transform: translateY(-110vh) scale(1.5);
            opacity: 0;
        }
    }
</style>
</head>

<body>

<div class="box">
    <h1>Happy Kiss Day Mau 😘💗</h1>
    <button onclick="goNext()">Click here 💓</button>
</div>

<script>
    function goNext() {
        window.location.href = "kiss.html";
    }

    function createHeart() {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 20 + 15) + "px";
        heart.style.animationDuration = (Math.random() * 5 + 5) + "s";
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 8000);
    }

    setInterval(createHeart, 500);
</script>

</body>
</html>
