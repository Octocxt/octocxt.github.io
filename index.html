<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Georgia,serif;color:#593743;background:linear-gradient(135deg,#fff0f3,#f9e2eb,#fff8f1);overflow:hidden}.card{position:relative;text-align:center;width:min(440px,100%);padding:38px 25px;background:#fffafbd9;border:1px solid #f0ccd7;border-radius:24px;box-shadow:0 18px 55px #a94e6a22;animation:show .8s ease both}h1{font-weight:normal;font-size:clamp(30px,8vw,42px);margin:8px 0 18px}.heart{font-size:38px;color:#c45175;animation:pulse 1.6s infinite}.message{font-size:19px;line-height:1.6;margin:22px 0}.love{font-size:25px;color:#b64268;margin:20px 0 25px}button{border:0;border-radius:30px;background:#b94f70;color:white;padding:12px 20px;font-size:14px;cursor:pointer;box-shadow:0 6px 16px #b94f7033}button:hover{transform:translateY(-2px)}.small{font:12px Arial,sans-serif;color:#a27c89;margin-top:18px}.float{position:fixed;bottom:-30px;color:#d77b98;opacity:.5;animation:rise linear infinite;pointer-events:none}@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}@keyframes show{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{50%{transform:scale(1.13)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style></head>
<body>
<main class="card"><div class="heart">♡</div><h1>I'm Sorry</h1><p class="message">I'm truly sorry for the hurtful things I said. You didn't deserve that, and I wish I could take those words back. ❤️</p><div class="love" id="love">I love you so much. 🥺❤️</div><button id="more">One more thing 💌</button><p class="small" id="extra" hidden>You mean so much to me. I'll try to handle my feelings better and treat your heart with the care it deserves. 💗</p></main>
<script>
const extra=document.getElementById('extra');document.getElementById('more').addEventListener('click',()=>{extra.hidden=!extra.hidden;document.getElementById('more').textContent=extra.hidden?'One more thing 💌':'Always, with love ❤️'});
for(let i=0;i<16;i++){const h=document.createElement('span');h.className='float';h.textContent=['♡','♥','💕'][i%3];h.style.left=Math.random()*100+'%';h.style.animationDuration=(7+Math.random()*8)+'s';h.style.animationDelay=(-Math.random()*12)+'s';h.style.fontSize=(14+Math.random()*18)+'px';document.body.appendChild(h)}
</script></body></html>
