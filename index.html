<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💕</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background-color: #ffd6e8;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
    }

    .box {
        background: white;
        padding: 30px 40px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        position: relative;
    }

    h1 {
        color: #ff4d88;
        margin-bottom: 20px;
    }

    button {
        padding: 10px 25px;
        font-size: 16px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        margin: 10px;
    }

    #yes {
        background-color: #ff4d88;
        color: white;
        position: absolute;
    }

    #no {
        background-color: #ccc;
    }
</style>
</head>

<body>

<div class="box">
    <h1>Will you be my Valentine? 💘</h1>
    <button id="yes">Yes</button>
    <button id="no" onclick="goNext()">No</button>
</div>

<script>
    const yesBtn = document.getElementById("yes");

    yesBtn.addEventListener("click", () => {
        const box = document.querySelector(".box");
        const boxRect = box.getBoundingClientRect();

        const maxX = boxRect.width - yesBtn.offsetWidth;
        const maxY = boxRect.height - yesBtn.offsetHeight;

        const randomX = Math.random() * maxX;
        const randomY = Math.random() * maxY;

        yesBtn.style.left = randomX + "px";
        yesBtn.style.top = randomY + "px";
    });

    function goNext() {
        window.location.href = "no.html";
    }
</script>

</body>
</html>
